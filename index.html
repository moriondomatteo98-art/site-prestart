<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pre-Start</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-title" content="Pre-Start">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Same look as the Site Diary: off-white logo bar with red rule, white cards on light grey, black bottom bar. */
:root{
  --bg:#f1f1ef; --surface:#ffffff; --ink:#0b0b0b; --muted:#666666; --line:#e1e1de;
  --brand:#ff3131; --accent:#e42424; --accent-ink:#ffffff; --wip:#f4b400; --wip-ink:#0b0b0b;
  --ok:#1f8a4c; --ok-ink:#ffffff; --warn:#b86e00; --crit:#c81e1e;
  --display:"Poppins","Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101010; --surface:#1b1b1b; --ink:#f4f4f2; --muted:#a3a3a0; --line:#2f2f2f;
    --accent:#ff4a4a; --accent-ink:#0b0b0b; --ok:#4fc27f; --ok-ink:#0f2a1b; --warn:#f0b04a; --crit:#ff6b6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101010; --surface:#1b1b1b; --ink:#f4f4f2; --muted:#a3a3a0; --line:#2f2f2f;
  --accent:#ff4a4a; --accent-ink:#0b0b0b; --ok:#4fc27f; --ok-ink:#0f2a1b; --warn:#f0b04a; --crit:#ff6b6b; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
/* No pinch or double-tap zoom, no sideways sliding: the page only scrolls up and down. */
html{touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-x:none}
input,select,textarea,button{min-width:0;max-width:100%}
.row>*,.card,main{min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
/* 16px stops iPhone zooming in when you tap a box */
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{width:100%;position:sticky;top:0;z-index:5;background:#f8f8f8;color:#0b0b0b;border-bottom:3px solid var(--brand);padding:8px 16px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
.top .r1,.top .r2{display:flex;align-items:center;gap:8px;min-width:0}
#logo{height:32px;width:auto;display:block}
.tag{font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:#666;margin-right:auto;padding-left:8px;border-left:2px solid #d8d8d6;line-height:1.2;white-space:nowrap}
.top button{background:#ebebe9;border:0;border-radius:10px;color:#0b0b0b;min-height:42px;padding:0 14px;font-weight:600;cursor:pointer}
.top .r2 button{width:42px;padding:0;font-size:20px;flex:none}
.top .r2 button#date{flex:1 1 0;width:0;min-width:0;font-size:15px}
.top .r2 button#histBtn{width:auto;padding:0 12px;font-size:14px;white-space:nowrap}
.top button.on{background:var(--accent);color:#fff}

main{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.risk{border-left:5px solid var(--brand)}
.card h2,dialog h2{font:600 18px var(--display);letter-spacing:-.01em}
.card h2::after,dialog h2::after{content:".";color:var(--brand)}
.hero .h{font:700 26px var(--display);line-height:1.1}
.hero .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:default;min-height:72px}
.tile span{font-size:13px;color:var(--muted);font-weight:500}
.tile b{font:700 30px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}

label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.empty{color:var(--muted);font-size:14px}
.ghost{background:transparent;border:1px dashed var(--muted);border-radius:8px;min-height:44px;cursor:pointer;font-weight:600}
.del{background:none;border:0;color:var(--crit);cursor:pointer;font-weight:600;min-height:36px;padding:0 6px}
.dl{display:flex;flex-direction:column;gap:6px}
.dl .it{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-size:15px}
.dl .it span{min-width:0;overflow-wrap:anywhere}

.bar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;z-index:6;background:#0b0b0b;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar button{background:#1f1f1f;border:0;border-radius:12px;color:#fff;min-height:56px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.bar button svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app.locked .card{opacity:.92}
#app.locked input:disabled,#app.locked textarea:disabled{opacity:1;-webkit-text-fill-color:var(--ink);cursor:default}

dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(94vw,560px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
#dlgIn:focus{outline:none}
dialog .in{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain}
dialog .in>.btns{position:sticky;bottom:-16px;background:var(--surface);padding:10px 0 16px;margin-bottom:-16px;border-top:1px solid var(--line)}
dialog h2{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:2px 0}
.cal button,.cal .x{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;min-height:40px;font-variant-numeric:tabular-nums;padding:0}
.cal .x{border:0;background:transparent;cursor:default}
.cal button.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.cal button.wip{background:var(--wip);border-color:var(--wip);color:var(--wip-ink)}
.cal button.draft{border:2px dashed var(--muted)}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.cur{text-decoration:underline}
.calnav{display:flex;align-items:center;gap:8px}
.calnav b{flex:1;text-align:center;font:600 18px var(--display)}
.calnav button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{min-height:54px;font-size:16px;width:100%}
.sev{display:flex;gap:8px}
.sev button{flex:1;min-height:44px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.sev button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{flex-basis:100%;color:var(--crit);font-weight:600;font-size:15px}
.err.ok{color:var(--ok);font-size:16px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:400;flex-direction:row;cursor:pointer}
.chk input{width:24px;height:24px;min-height:0;margin-top:2px;flex:none;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Login screen */
#login{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
#login .lg{max-width:420px;width:100%;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:14px}
#login h1{font:700 26px var(--display)}
#login h1::after{content:".";color:var(--brand)}
#login .sub{color:var(--muted);font-size:14px;margin-top:-8px}
#login input{background:var(--surface)}
#login .err{flex-basis:auto}
body.auth #bar,body.auth #app{display:none}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Pre-start pieces */
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv>div{padding:7px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.kv>div:nth-child(2n){border-right:0}
.kv>div.w{grid-column:1/-1;border-right:0}
.kv>div:last-child{border-bottom:0}
.kv span{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.note{font-style:italic;color:var(--muted);font-size:14px}
.ans{display:inline-block;padding:1px 12px;border-radius:99px;font-weight:700;font-size:14px;border:1.5px solid currentColor}
.ans.yes{color:var(--crit)}.ans.no{color:var(--ok)}
.box3{display:flex;flex-direction:column;gap:10px}
.box3 section{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;background:var(--bg)}
.box3 h3{font:600 16px var(--display)}
.box3 ol{margin:6px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.names{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;overscroll-behavior:contain}
.names button{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:50px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:left;cursor:pointer;font-weight:600;font-size:16px;color:var(--ink)}
.names button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.names button:disabled{opacity:.5;cursor:default}
.names small{font-weight:600;color:var(--ok);font-size:13px}
.sig{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;height:190px;touch-action:none;user-select:none;-webkit-user-select:none}
.sig canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:8px}
.sig .ph{position:absolute;left:14px;right:14px;bottom:34px;border-top:1.5px dashed #bdbdbd;pointer-events:none}
.sig .ph::after{content:"Sign here with your finger";position:absolute;left:0;top:4px;color:#9a9a9a;font-size:13px}
.sig.has .ph::after{content:""}
.att{display:flex;flex-direction:column;gap:6px}
.att .it{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.att img{width:76px;height:38px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid var(--line);display:block}
.att .nm{font-weight:600;overflow-wrap:anywhere}
.att small{color:var(--muted);font-variant-numeric:tabular-nums}
.flag{display:inline-block;color:var(--warn);font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:99px;padding:0 7px;margin-left:4px}
.pub{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.donebox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.done-ic{width:76px;height:76px;border-radius:50%;background:var(--ok);color:var(--ok-ink);display:grid;place-items:center;font:700 42px var(--display)}
.donebox .h{font:700 26px var(--display)}
.steps{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.qrv{position:fixed;inset:0;z-index:40;background:#fff;color:#0b0b0b;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;padding-top:max(16px,env(safe-area-inset-top));overflow:auto;text-align:center}
.qrv img.lg{height:30px;width:auto}
.qrv h2{font:700 22px var(--display)}.qrv h2::after{content:".";color:#ff3131}
.qrv .q{width:min(88vw,58vh);max-width:520px}
.qrv .q svg{width:100%;height:auto;display:block}
.qrv .s{color:#555;font-size:15px}
.qrv .btns{justify-content:center}
.qrv .btn{background:#f1f1ef;border-color:#e1e1de;color:#0b0b0b}
.qrv .btn.primary{background:#e42424;border-color:#e42424;color:#fff}
body.worker{padding-bottom:28px}
body.worker #bar,body.worker .top .r2,body.worker #pdfBtn{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="r1">
    <img id="logo" alt="Transform Group" width="154" height="32"><span class="tag">Pre-start</span>
    <button id="pdfBtn" class="on" hidden>PDF</button>
  </div>
  <div class="r2" hidden>
    <button id="prev" aria-label="Previous day">&lsaquo;</button>
    <button type="button" id="date" aria-label="Choose a day"></button>
    <button id="next" aria-label="Next day">&rsaquo;</button>
    <button id="histBtn">All days</button>
  </div>
</header>

<main id="app"></main>

<nav class="bar" id="bar" aria-label="Actions" hidden>
  <button data-act="qr"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>QR code</button>
  <button data-act="att"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>Attendance</button>
  <button data-act="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>People</button>
  <button data-act="complete"><svg viewBox="0 0 24 24"><path d="M3 17c3-4 5-4 6-1s3 3 5-1 4-3 7 1"/><path d="M3 21h18"/></svg>Complete</button>
</nav>

<section id="login" hidden aria-labelledby="lgT">
  <header class="top" style="position:static"><div class="r1"><img id="logo2" alt="Transform Group" width="154" height="32" style="height:32px;width:auto"><span class="tag">Pre-start</span></div></header>
  <form class="lg" id="lgForm" novalidate>
    <h1 id="lgT">Log in</h1>
    <div class="sub">Supervisor login. Workers don't need to log in: they scan the QR code.</div>
    <label>Email<input type="email" id="lgEmail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required></label>
    <label>Password<input type="password" id="lgPw" autocomplete="current-password" required></label>
    <div id="lgErr" class="err" role="alert" hidden></div>
    <button class="btn primary" id="lgBtn" type="submit" style="min-height:52px;font-size:16px">Log in</button>
    <button class="btn" id="lgForgot" type="button">Forgot password</button>
  </form>
</section>

<dialog id="dlg"><div class="in" id="dlgIn" tabindex="-1" autofocus></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/supabase.js"></script>

/* ---------- finger signature pad ---------- */
function sigPad(wrap){
  const cv=wrap.querySelector("canvas"),ctx=cv.getContext("2d");let strokes=[],st=null,dpr=1;
  const style=()=>{ctx.lineWidth=2.6*dpr;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b0b0b";ctx.fillStyle="#0b0b0b"};
  const seg=(a,b)=>{ctx.beginPath();ctx.moveTo(a[0]*dpr,a[1]*dpr);ctx.lineTo(b[0]*dpr,b[1]*dpr);ctx.stroke()};
  const dot=p=>{ctx.beginPath();ctx.arc(p[0]*dpr,p[1]*dpr,1.3*dpr,0,7);ctx.fill()};
  const redraw=()=>{ctx.clearRect(0,0,cv.width,cv.height);style();strokes.forEach(s=>{dot(s[0]);for(let i=1;i<s.length;i++)seg(s[i-1],s[i])})};
  const size=()=>{const b=cv.getBoundingClientRect();if(!b.width)return;dpr=window.devicePixelRatio||1;cv.width=Math.round(b.width*dpr);cv.height=Math.round(b.height*dpr);redraw()};
  const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}st=[pt(e)];strokes.push(st);style();dot(st[0]);wrap.classList.add("has");wrap.dispatchEvent(new Event("sig"))});
  cv.addEventListener("pointermove",e=>{if(!st)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){const p=pt(ev);seg(st[st.length-1],p);st.push(p)}});
  const end=()=>{st=null};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("lostpointercapture",end);
  size();const ro=window.ResizeObserver?new ResizeObserver(()=>size()):null;if(ro)ro.observe(cv);
  const ink=()=>{let n=0;strokes.forEach(s=>{for(let i=1;i<s.length;i++)n+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1])});return n};
  return{
    clear(){strokes=[];redraw();wrap.classList.remove("has")},
    empty(){return ink()<25},
    png(maxW=420,maxH=150){ // trimmed to the ink, small file (usually 4-15 KB)
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;strokes.forEach(s=>s.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}));
      const pad=5;x0-=pad;y0-=pad;x1+=pad;y1+=pad;const bw=Math.max(1,x1-x0),bh=Math.max(1,y1-y0);
      for(let k=1;k>.2;k*=.7){
        const s=Math.min(maxW/bw,maxH/bh,2)*k,o=document.createElement("canvas");o.width=Math.ceil(bw*s);o.height=Math.ceil(bh*s);
        const c=o.getContext("2d");c.lineWidth=Math.max(1.6,Math.min(5,2.6*s));c.lineCap="round";c.lineJoin="round";c.strokeStyle="#000";c.fillStyle="#000";
        strokes.forEach(st=>{c.beginPath();c.arc((st[0][0]-x0)*s,(st[0][1]-y0)*s,c.lineWidth/2,0,7);c.fill();c.beginPath();c.moveTo((st[0][0]-x0)*s,(st[0][1]-y0)*s);
          for(let i=1;i<st.length;i++)c.lineTo((st[i][0]-x0)*s,(st[i][1]-y0)*s);c.stroke()});
        const url=o.toDataURL("image/png");if(url.length<120000)return url}
      return null}
  };
}

/* ---------- QR code ---------- */
function qrMatrix(text){const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=[];for(let r=0;r<n;r++){m.push([]);for(let c=0;c<n;c++)m[r].push(q.isDark(r,c))}return m}
function qrSVG(text){const m=qrMatrix(text),n=m.length,b=4;let d="";m.forEach((row,r)=>row.forEach((on,c)=>{if(on)d+=`M${c+b} ${r+b}h1v1h-1z`}));

function pdfKit(){

  const k={doc,W,M,CW,BOT,y:12};

    doc.setLineWidth(.25);k.y=y+h+7};

    let h=minH;cells.forEach(c=>{const L=k.cellLines(c,c.w);h=Math.max(h,L.length*k.lh(c.size||8.5)+2.4)});
    if(k.ensure(h)&&opt.onBreak)opt.onBreak();

      doc.setDrawColor(0);doc.setLineWidth(.25);
      if(c.fill){doc.setFillColor(...c.fill);doc.rect(x,k.y,c.w,h,"FD")}else doc.rect(x,k.y,c.w,h);
      const L=k.cellLines(c,c.w),sz=c.size||8.5,lh=k.lh(sz);doc.setTextColor(0);
      const ty=c.top?k.y+lh*.85+.6:k.y+(h-L.length*lh)/2+lh*.78;
      L.forEach((l,i)=>doc.text(l,c.align==="center"?x+c.w/2:x+1.5,ty+i*lh,{align:c.align==="center"?"center":"left"}));
      if(c.img&&c.img.src){const [iw,ih]=c.img.size||[3,1],mw=c.w-2,mh=h-1,s=Math.min(mw/iw,mh/ih);try{doc.addImage(c.img.src,"PNG",x+1+(mw-iw*s)/2,k.y+.5+(mh-ih*s)/2,iw*s,ih*s)}catch(e){}}
      if(c.draw)c.draw(x,k.y,c.w,h);
      x+=c.w});
    k.y+=h;return h};
  k.footer=()=>{const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);k.font("normal",7.5);doc.setTextColor(90);doc.text(`Page | ${i}`,M+3,287);doc.text("OHSE 13- Daily Prestart – Rev 2",M+3,290.6)}doc.setTextColor(0)};
  k.box=(x,y,on)=>{doc.setLineWidth(.3);doc.rect(x,y,2.8,2.8);if(on){doc.setLineWidth(.45);doc.line(x+.5,y+.5,x+2.3,y+2.3);doc.line(x+2.3,y+.5,x+.5,y+2.3)}doc.setLineWidth(.25)};

}

  let res;try{res=await sb.rpc("sign_prestart",{p_day:W.day,p_token:W.token,p_person_id:W.typed?null:W.pick,p_typed_name:W.typed?typed:null,p_signature:png})}catch(e){res={error:e}}
  btn.disabled=false;btn.textContent="Sign pre-start";
  if(res.error){wErr("No signal. Your signature hasn't been sent. Try again.");return}
  const d=res.data||{};

  if(["invalid","expired","locked","closed"].includes(d.error)){wMsg(d.error==="closed"?"Today's pre-start is closed":"This QR code doesn't work today",WERR[d.error]);return}
  wErr(WERR[d.error]||"Something went wrong. Try again.");
}

/* ======================================================================
   SUPERVISOR MODE (logged in)
   ====================================================================== */
const COLS=["day","project","site_address","work_location","building","level","weather","weather_manual","leader","issues","issues_details","planned","hazards","notes","token","published_at","completed_at","supervisor_name","supervisor_signature"];
const LIST_COLS=COLS.filter(c=>c!=="supervisor_signature").concat("updated_at").join(",");
const SET_COLS=["project","site_address","work_location","building","level","leader","hazards","notes","builder_email"];
let settings={...DEF_SETTINGS},people=[],days={},sigs={},cur="",outbox={days:{},settings:null},saving=false,flushTimer=null,calM="",pollTimer=null,owner=null,pulled=false;
const pick=(o,ks)=>{const r={};ks.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});return r};
const blankDay=k=>({day:k,...pick(settings,["project","site_address","work_location","building","level","leader","hazards","notes"]),weather:"",weather_manual:false,issues:null,issues_details:"",planned:"",token:null,published_at:null,completed_at:null,supervisor_name:"",supervisor_signature:null});
const rec=()=>days[cur]||blankDay(cur);
const edit=()=>days[cur]||(days[cur]=blankDay(cur));
const activePeople=()=>people.filter(p=>p.active);
const dayStatus=k=>{const r=days[k];if(!r)return"blank";if(r.completed_at)return"done";if(r.published_at)return"wip";return"draft"};

function storedUser(){try{const s=JSON.parse(localStorage.getItem(AUTH_KEY)||"null");return s&&s.user&&s.user.id?s.user:null}catch(e){return null}}
function saveCache(){try{const lite={};for(const k in days){const r={...days[k]};delete r.supervisor_signature;lite[k]=r}
  localStorage.setItem(LSC,JSON.stringify({settings,people,days:lite}));localStorage.setItem(LSQ,JSON.stringify(outbox))}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(LSC)||"null");if(c){settings={...DEF_SETTINGS,...(c.settings||{})};people=c.people||[];days=c.days||{}}}catch(e){}
  try{const o=JSON.parse(localStorage.getItem(LSQ)||"null");if(o&&o.days)outbox={days:o.days,settings:o.settings||null};for(const k in outbox.days){const x=clone(outbox.days[k]);delete x._at;days[k]=x}}catch(e){}}
function markDay(k){outbox.days[k]={...clone(days[k]),_at:Date.now()};saveCache()}
function markSettings(){outbox.settings=clone(pick(settings,SET_COLS));saveCache()}
const pending=()=>Object.keys(outbox.days).length+(outbox.settings?1:0);
function status(t,busy){const e=$("#statusTxt");if(e){e.textContent=t;$("#dot").classList.toggle("busy",!!busy)}}
function finalStatus(){status(pending()?(online()?"Not saved yet. Retrying…":"No signal: saved on this phone only"):"Saved",!!pending())}
function soon(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms==null?700:ms)}
async function flush(){
  if(saving||!sb||!online()||!storedUser()||!pulled){finalStatus();return}
  if(!pending()){finalStatus();return}
  saving=true;status("Saving…",true);
  try{
    for(const k of Object.keys(outbox.days)){const snap=outbox.days[k];
      const {error}=await sb.from("prestarts").upsert({...pick(snap,COLS),updated_at:new Date().toISOString()});
      if(error){console.warn(error);if(error.code==="23505"&&/token/.test(error.message||"")){days[k].token=newToken();markDay(k)}continue}
      if(outbox.days[k]===snap)delete outbox.days[k]}
    if(outbox.settings){const snap=outbox.settings;const {error}=await sb.from("settings").upsert({id:1,...snap,updated_at:new Date().toISOString()});if(!error&&outbox.settings===snap)outbox.settings=null}
  }catch(e){console.warn(e)}
  finally{saving=false;saveCache();finalStatus()}
}
async function pull(){
  if(!sb||!online()||!storedUser())return;
  status("Loading…",true);
  try{
    const o=await sb.from("app_owner").select("user_id").limit(1);
    if(o.error){if(o.status===401||/JWT/i.test(o.error.message||"")){showLogin(true)}finalStatus();return}
    owner=!!(o.data&&o.data.length);if(!owner){notOwner();return}
    const [st,pp,ds]=await Promise.all([sb.from("settings").select(SET_COLS.join(",")).eq("id",1).maybeSingle(),
      sb.from("people").select("id,name,active").order("name"),sb.from("prestarts").select(LIST_COLS)]);
    if(st.data&&!outbox.settings)settings={...DEF_SETTINGS,...st.data};
    if(pp.data)people=pp.data;
    if(ds.data){const keep={};for(const k in days)if(days[k]&&days[k].supervisor_signature)keep[k]=days[k].supervisor_signature;
      const nd={};ds.data.forEach(r=>{nd[r.day]=r;if(keep[r.day]&&r.completed_at)r.supervisor_signature=keep[r.day]});
      /* Merge what's waiting on this phone: the newer version wins, and a published/completed day online is never replaced by a draft. */
      for(const k in outbox.days){const loc=outbox.days[k],srv=nd[k];
        if(srv&&(Date.parse(srv.updated_at||0)>(loc._at||0)||(srv.completed_at&&!loc.completed_at))){delete outbox.days[k];continue}
        const x=clone(days[k]);if(srv&&srv.token&&!x.token){x.token=srv.token;x.published_at=srv.published_at}nd[k]=x;outbox.days[k]={...clone(x),_at:loc._at}}
      days=nd}
    pulled=true;
    saveCache();render();await loadSigs(cur);
  }catch(e){console.warn(e)}
  flush();
}
function notOwner(){$("#app").innerHTML=`<section class="card"><h2>Not the supervisor account</h2><div class="empty">You're logged in as ${esc((storedUser()||{}).email||"")}, but this account isn't set up as the pre-start supervisor.</div><button class="btn" id="lo2">Log out</button></section>`;$("#lo2").onclick=logout}
async function loadSigs(k){
  if(!sb||!online()||!days[k]||!days[k].published_at)return drawAtt();
  const {data,error}=await sb.from("signoffs").select("id,day,person_id,name,typed_by_worker,signature,signed_at").eq("day",k).order("signed_at");
  if(!error){sigs[k]=data||[];}drawAtt();
}
function poll(){clearInterval(pollTimer);pollTimer=setInterval(()=>{const r=days[cur];
  if(document.visibilityState==="visible"&&r&&r.published_at&&!r.completed_at&&cur===sydToday()&&!($("#dlg").open))loadSigs(cur)},6000)}

/* ---------- automatic weather (Open-Meteo forecast; address lookup via OpenStreetMap), like the diary ---------- */
function wxDesc(c){c=Number(c);if(c===0)return"Clear";if(c===1)return"Mostly sunny";if(c===2)return"Partly cloudy";if(c===3)return"Overcast";if(c===45||c===48)return"Fog";
  if(c>=51&&c<=57)return"Drizzle";if(c>=61&&c<=67)return"Rain";if(c>=71&&c<=77)return"Snow";if(c>=80&&c<=82)return"Showers";if(c>=95)return"Thunderstorms";return"Cloudy"}
async function siteGeo(addr){
  addr=String(addr||"").trim();if(!addr)return null;
  try{const g=JSON.parse(localStorage.getItem(LSG)||"null");if(g&&g.address===addr)return g.none?null:g}catch(e){}
  const qs=[...new Set([addr,addr.replace(/^[\d\s\-\/]+/,""),addr.split(/\s+/).pop()])].filter(Boolean);
  for(const q of qs){const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q=${encodeURIComponent(q)}`);if(!r.ok)continue;const j=await r.json();
    if(j&&j[0]){const g={address:addr,lat:Number(j[0].lat),lon:Number(j[0].lon)};try{localStorage.setItem(LSG,JSON.stringify(g))}catch(e){}return g}}
  try{localStorage.setItem(LSG,JSON.stringify({address:addr,none:true}))}catch(e){}return null}
const wxBusy={};
async function autoWeather(k,asked){
  const r=days[k];if(!r||r.completed_at||(r.weather_manual&&!asked)||wxBusy[k])return;
  if(!online()){if(asked)toast("No signal. Try again when you're online.");return}
  wxBusy[k]=1;let ok=false;
  try{const g=await siteGeo(r.site_address);if(!g){if(asked)toast("Couldn't find the site address for the weather");return}
    const q=`latitude=${g.lat}&longitude=${g.lon}&daily=weather_code,precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=Australia%2FSydney&start_date=${k}&end_date=${k}`;
    let res=await fetch("https://api.open-meteo.com/v1/forecast?"+q);if(!res.ok)res=await fetch("https://archive-api.open-meteo.com/v1/archive?"+q.replace(",precipitation_probability_max",""));if(!res.ok)return;
    const D=(await res.json()).daily;if(!D||!D.time||!D.time.length||D.temperature_2m_max[0]==null)return;
    const rain=Math.round((D.precipitation_sum[0]||0)*10)/10,pp=D.precipitation_probability_max?D.precipitation_probability_max[0]:null,wind=Math.round(D.wind_speed_10m_max[0]||0);
    const t=[`${wxDesc(D.weather_code[0])}, ${Math.round(D.temperature_2m_min[0])}-${Math.round(D.temperature_2m_max[0])}°C`];
    if(rain>0)t.push(`${rain} mm rain${pp!=null?` (${pp}%)`:""}`);if(wind>=25)t.push(`wind ${wind} km/h`);
    const x=days[k];if(!x||x.completed_at||(x.weather_manual&&!asked))return;
    x.weather=t.join(", ");x.weather_manual=false;markDay(k);soon();ok=true;
    if(k===cur){const f=document.querySelector("[data-f=weather]");if(f)f.value=x.weather}
  }catch(e){console.warn("weather",e)}
  finally{delete wxBusy[k];if(asked)toast(ok?"Weather: "+days[k].weather:"Couldn't get the weather. Try again later.")}
}

    <div class="row3">${fld("work_location","Work location",r.work_location)}${fld("building","Building",r.building)}${fld("level","Level",r.level)}</div>

function wireDay(){
  const A=$("#app");
  A.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{const r=edit();r[el.dataset.f]=el.value;if(el.dataset.f==="weather")r.weather_manual=true;markDay(cur);soon(1200);status("Saving…",true)});
  A.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>{const r=edit(),v=b.dataset.yn==="yes";r.issues=r.issues===v?null:v;
    A.querySelectorAll("[data-yn]").forEach(x=>x.setAttribute("aria-pressed",String(r.issues===(x.dataset.yn==="yes"))));markDay(cur);soon()});
  const on=(id,fn)=>{const e=A.querySelector("#"+id);if(e)e.onclick=fn};

  on("notesStd",()=>{if(!confirm("Replace the notes with the standard list?"))return;const r=edit();r.notes=DEF_NOTES;markDay(cur);soon();render()});

  on("hPub",publish);on("hQr",()=>showQR(rec()));on("hPrint",()=>printQR(rec()));on("hPdf",pdfSheet);on("hReopen",reopen);

function drawAtt(){

/* ---------- publish, QR ---------- */
async function publish(){
  const r=edit();if(r.completed_at)return;
  if(!lines(r.planned).length&&!confirm("Planned work is empty. Publish anyway?"))return;
  if(!r.token)r.token=newToken();          // re-publishing keeps the same code, so printed QRs keep working that day
  if(!r.published_at)r.published_at=new Date().toISOString();
  markDay(cur);render();await flush();
  if(outbox.days[cur])toast("Published on this phone, but not online yet. The QR code works once it's saved.");
  showQR(days[cur]);loadSigs(cur);
}
let wake=null;
async function showQR(r){
  if(!r||!r.token)return;
  const v=document.createElement("div");v.className="qrv";v.setAttribute("role","dialog");v.setAttribute("aria-label","QR code");
  v.innerHTML=`<img class="lg" src="${LOGO}" alt="Transform Group"><h2>Scan to sign the pre-start</h2><div class="s"><b>${esc(r.project)}</b> · ${esc(nice(r.day))}</div>
    <div class="q">${qrSVG(qrLink(r))}</div><div class="s">Open your phone camera and point it at the code.${r.day===sydToday()?" Works today only.":` Works on ${esc(shortDay(r.day))} only.`}</div>
    <div class="btns"><button class="btn primary" id="qClose">Close</button><button class="btn" id="qPrint">Print QR</button><button class="btn" id="qCopy">Copy link</button></div>`;
  document.body.appendChild(v);
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}
  v.querySelector("#qClose").onclick=()=>{v.remove();try{wake&&wake.release()}catch(e){}wake=null;loadSigs(cur)};
  v.querySelector("#qPrint").onclick=()=>{v.remove();printQR(r)};
  v.querySelector("#qCopy").onclick=async()=>{try{await navigator.clipboard.writeText(qrLink(r));toast("Link copied")}catch(e){prompt("Copy this link:",qrLink(r))}};
}
async function printQR(r){
  sheet("Print QR code",`<div class="empty">An A4 page with the QR code and project name, for the noticeboard. It only works on ${esc(nice(r.day))}.</div><div id="mm" class="empty">Making the PDF…</div>`,null,null,async b=>{
    try{const blob=await buildQrPDF(r);fileButtons(b.querySelector("#mm"),blob,pdfName(r,"Pre-start QR"))}catch(e){b.querySelector("#mm").textContent="Couldn't make the PDF: "+(e.message||e)}});
}

/* ---------- complete / reopen / PDF ---------- */
function completeFlow(){
  const r=rec();
  if(r.completed_at){pdfSheet();return}
  if(!r.published_at){toast("Publish the day first, so workers can sign.");return}
  const n=(sigs[cur]||[]).length;
  sheet("Complete pre-start",`<div class="empty">${n} ${n===1?"person has":"people have"} signed. Once you complete it, sign-ins close and the PDF is made.</div>
    <label>Site supervisor / person responsible<input type="text" id="cName" value="${esc(r.supervisor_name||r.leader||"")}" autocomplete="name" autocapitalize="words"></label>
    <div><div class="empty" style="margin-bottom:6px">Your signature</div>${padHTML("cSig")}</div>`,"Complete and sign",async b=>{
    const name=b.querySelector("#cName").value.trim();if(!name){toast("Type your name");return false}
    if(pad.empty()){toast("Sign in the box with your finger");return false}
    if(!n&&!confirm("Nobody has signed yet. Complete anyway?"))return false;
    const png=pad.png();if(!png){toast("Signature too big. Clear it and sign again.");return false}
    const x=edit();x.supervisor_name=name;x.supervisor_signature=png;x.completed_at=new Date().toISOString();markDay(cur);await flush();
    if(outbox.days[cur])toast("Completed on this phone. It will save when you have signal.");
    render();setTimeout(pdfSheet,50);
  });
  let pad=sigPad($("#cSig"));$("[data-clear=cSig]").onclick=()=>pad.clear();
}
function reopen(){
  if(!confirm("Reopen this day? Your sign-off signature is removed and workers can sign again (if it's still today)."))return;
  const r=edit();r.completed_at=null;r.supervisor_signature=null;markDay(cur);soon(0);render();
}
async function pdfSheet(){
  const r=rec();
  sheet("Pre-start PDF",`<div id="mm" class="empty">Making the PDF…</div>`,null,null,async b=>{
    const mm=b.querySelector("#mm");
    try{
      if(r.published_at&&online())await loadSigs(cur);
      if(r.completed_at&&!r.supervisor_signature&&online()){const {data}=await sb.from("prestarts").select("supervisor_signature").eq("day",cur).maybeSingle();if(data&&days[cur])days[cur].supervisor_signature=data.supervisor_signature}
      const blob=await buildPDF(rec(),sigs[cur]||[]);
      fileButtons(mm,blob,pdfName(r),{emailTo:settings.builder_email||"",subject:`Daily pre-start ${dmy(r.day)} - ${r.project||""}`});
      if(!r.completed_at)mm.insertAdjacentHTML("afterbegin",`<div class="empty" style="color:var(--warn)">Not completed yet: the supervisor sign-off is blank.</div>`);
    }catch(e){console.error(e);mm.textContent="Couldn't make the PDF: "+(e.message||e)}
  });
}

/* ---------- people ---------- */
function peopleSheet(){
  const body=`<div style="display:flex;gap:8px"><input type="text" id="pName" placeholder="Full name" autocapitalize="words" autocomplete="off" aria-label="Full name" style="flex:1"><button class="btn primary" id="pAdd" type="button">Add</button></div>
    <details><summary class="empty" style="cursor:pointer">Paste a list of names (one per line)</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><textarea id="pBulk" rows="6" placeholder="One name per line"></textarea><button class="btn" id="pBulkAdd" type="button">Add all</button></div></details>
    <div class="empty" id="pCount"></div><div class="dl" id="pList"></div>`;
  sheet("People",body,null,null,b=>{
    const draw=()=>{const A=activePeople();b.querySelector("#pCount").textContent=`${A.length} ${A.length===1?"name":"names"} on the list. Workers pick their name from this list.`;
      b.querySelector("#pList").innerHTML=A.length?A.map(p=>`<div class="it"><span>${esc(p.name)}</span><button class="del" data-pid="${esc(p.id)}" type="button">Remove</button></div>`).join(""):`<div class="empty">No names yet.</div>`;
      b.querySelectorAll("[data-pid]").forEach(x=>x.onclick=async()=>{const p=people.find(q=>q.id===x.dataset.pid);if(!p||!confirm(`Remove ${p.name} from the list? Their past sign-ins stay.`))return;
        const {error}=await sb.from("people").delete().eq("id",p.id);if(error){toast("Couldn't remove. Check your signal.");return}people=people.filter(q=>q.id!==p.id);saveCache();draw();render()})};
    const add=async names=>{
      if(!online()){toast("No signal. Try again when you're online.");return 0}
      const have=new Set(people.map(p=>p.name.toLowerCase()));const seen=new Set();
      const rows=names.map(n=>n.replace(/\s+/g," ").trim().slice(0,80)).filter(n=>n.length>=2&&!have.has(n.toLowerCase())&&!seen.has(n.toLowerCase())&&seen.add(n.toLowerCase())).map(name=>({name}));
      if(!rows.length){toast(names.length>1?"All those names are already on the list":"That name is already on the list (or too short)");return 0}
      const {data,error}=await sb.from("people").insert(rows).select("id,name,active");if(error){toast("Couldn't add. Check your signal.");return 0}
      people=people.concat(data).sort((a,b)=>a.name.localeCompare(b.name));saveCache();draw();render();return data.length};
    b.querySelector("#pAdd").onclick=async()=>{const i=b.querySelector("#pName");if(await add([i.value])){i.value="";i.focus();okMsg("Added")}};
    b.querySelector("#pName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.querySelector("#pAdd").click()}};
    b.querySelector("#pBulkAdd").onclick=async()=>{const t=b.querySelector("#pBulk");const n=await add(t.value.split(/\r?\n/));if(n){t.value="";okMsg(`Added ${n} ${n===1?"name":"names"}`)}};
    draw();
  });
}

/* ---------- settings ---------- */
function settingsSheet(){
  const s=settings;
  sheet("Settings",`<label>Builder's email (for sending the PDF)<input type="email" id="sEmail" value="${esc(s.builder_email)}" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@builder.com.au"></label>
    <div class="empty">New days start with these:</div>
    <label>Project<input type="text" id="s_project" value="${esc(s.project)}"></label><label>Site address<input type="text" id="s_site_address" value="${esc(s.site_address)}"></label>
    <div class="row3"><label>Work location<input type="text" id="s_work_location" value="${esc(s.work_location)}"></label><label>Building<input type="text" id="s_building" value="${esc(s.building)}"></label><label>Level<input type="text" id="s_level" value="${esc(s.level)}"></label></div>
    <label>Person leading the meeting<input type="text" id="s_leader" value="${esc(s.leader)}"></label>
    <label>Hazards and control measures (one per line)<textarea id="s_hazards" rows="6">${esc(s.hazards)}</textarea></label>
    <label>Other notes (one per line)<textarea id="s_notes" rows="8">${esc(s.notes)}</textarea></label>`,"Save",b=>{
    const em=b.querySelector("#sEmail").value.trim();if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast("That email doesn't look right");return false}
    settings.builder_email=em;["project","site_address","work_location","building","level","leader","hazards","notes"].forEach(k=>settings[k]=b.querySelector("#s_"+k).value);
    markSettings();soon(0);toast("Settings saved");
  });
}

/* ---------- calendar (All days) ---------- */
function calendar(){
  if(!calM)calM=cur.slice(0,7);
  const [y,m]=calM.split("-").map(Number),first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,n=new Date(y,m,0).getDate(),t=sydToday();
  let cells="";for(let i=0;i<lead;i++)cells+='<span class="x"></span>';
  for(let dd=1;dd<=n;dd++){const k=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`,st=dayStatus(k);
    cells+=`<button type="button" data-k="${k}" class="${st} ${k===t?"today":""} ${k===cur?"cur":""}" aria-label="${esc(nice(k))}, ${st==="done"?"completed":st==="wip"?"published":st==="draft"?"draft":"no pre-start"}">${dd}</button>`}
  const body=`<div class="calnav"><button type="button" id="cp" aria-label="Previous month">&lsaquo;</button><b>${esc(first.toLocaleDateString("en-AU",{month:"long",year:"numeric"}))}</b><button type="button" id="cn" aria-label="Next month">&rsaquo;</button></div>
    <div class="cal">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Completed</span><span><i style="background:var(--wip)"></i>Published</span><span><i style="border:2px dashed var(--muted)"></i>Draft</span></div>
    <div class="btns"><button class="btn" id="ct" type="button">Go to today</button><button class="btn" id="cs" type="button">Settings</button></div>
    <div class="acct"><span>${esc((storedUser()||{}).email||"")}${pending()?" · "+pending()+" change(s) waiting to save":""}</span><button class="del" id="lo" type="button">Log out</button></div>
    <div class="empty" style="font-size:12px;text-align:right">Pre-Start ${APP_VERSION}</div>`;
  sheet("All days",body,null,null,b=>{
    b.querySelector("#lo").onclick=logout;b.querySelector("#cs").onclick=settingsSheet;
    const mv=d=>{const dt=new Date(y,m-1+d,1);calM=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;calendar()};
    b.querySelector("#cp").onclick=()=>mv(-1);b.querySelector("#cn").onclick=()=>mv(1);
    b.querySelector("#ct").onclick=()=>{$("#dlg").close();go(sydToday())};
    b.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{$("#dlg").close();go(x.dataset.k)});
  });
}
function go(s){cur=s;try{history.replaceState(null,"","#"+s)}catch(e){}render();loadSigs(cur)}

/* ---------- login (same as the diary) ---------- */
function showLogin(on){$("#login").hidden=!on;document.body.classList.toggle("auth",!!on);if(on)setTimeout(()=>{try{$("#lgEmail").focus()}catch(e){}},50)}
function lgErr(t,ok){const e=$("#lgErr");e.textContent=t||"";e.hidden=!t;e.classList.toggle("ok",!!ok)}
$("#lgForm").onsubmit=async e=>{e.preventDefault();
  const email=$("#lgEmail").value.trim(),password=$("#lgPw").value;
  if(!email||!password){lgErr("Enter your email and password");return}
  if(!sb){lgErr("Couldn't load the login. Check your signal and reload.");return}
  $("#lgBtn").disabled=true;$("#lgBtn").textContent="Logging in";lgErr("");
  try{const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){lgErr(/invalid/i.test(error.message)?"Wrong email or password":/fetch|network/i.test(error.message)?"No signal. Try again when you're online.":error.message);return}
    $("#lgPw").value="";showLogin(false);await pull();
  }catch(x){lgErr("No signal. Try again when you're online.")}
  finally{$("#lgBtn").disabled=false;$("#lgBtn").textContent="Log in"}
};
$("#lgForgot").onclick=async()=>{
  const email=$("#lgEmail").value.trim();if(!email){lgErr("Type your email above first");return}
  try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)throw error;lgErr("If that's your account, a reset link is on its way. Open it on this phone.",true)}catch(x){lgErr("Couldn't send the email. Try again later.")}
};
function newPassword(){
  sheet("Set a new password",`<label>New password<input type="password" id="np" autocomplete="new-password" minlength="8"></label><div class="empty">At least 8 characters.</div>`,"Save password",async b=>{
    const pw=b.querySelector("#np").value;if(pw.length<8){toast("Use at least 8 characters");return false}
    const {error}=await sb.auth.updateUser({password:pw});if(error){toast(error.message);return false}
    toast("Password changed");
  });
}
async function logout(){
  if(pending()&&!confirm("Some changes haven't been saved online yet (no signal). Logging out now will lose them. Log out anyway?"))return;
  try{$("#dlg").close()}catch(e){}
  try{await sb.auth.signOut({scope:"local"})}catch(e){}
  [LSC,LSQ,AUTH_KEY].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  settings={...DEF_SETTINGS};people=[];days={};sigs={};outbox={days:{},settings:null};pulled=false;render();showLogin(true);
}

function supervisorMain(){
  $(".top .r2").hidden=false;$("#bar").hidden=false;$("#pdfBtn").hidden=false;
  loadCache();
  const h0=(location.hash||"").slice(1);cur=isDate(h0)?h0:sydToday();
  render();
  if(!storedUser()&&!/access_token|type=recovery/.test(location.hash))showLogin(true);
  if(sb){
    sb.auth.onAuthStateChange((ev,session)=>{
      if(ev==="PASSWORD_RECOVERY"){showLogin(false);setTimeout(newPassword,300)}
      else if(ev==="SIGNED_OUT"){showLogin(true)}
      else if(session&&ev==="SIGNED_IN"&&!$("#login").hidden){showLogin(false);pull()}
    });
    if(storedUser())pull();
  }
  $("#histBtn").onclick=()=>{calM=cur.slice(0,7);calendar()};
  $("#date").onclick=()=>{calM=cur.slice(0,7);calendar()};
  $("#prev").onclick=()=>go(shift(cur,-1));
  $("#next").onclick=()=>go(shift(cur,1));
  $("#pdfBtn").onclick=pdfSheet;
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>({
    qr:()=>{const r=rec();if(r.completed_at){toast("This day is completed. Sign-ins are closed.");return}r.published_at?showQR(r):publish()},
    att:()=>{const c=$("#attCard");if(c)c.scrollIntoView({behavior:"smooth",block:"start"});else toast("Publish the day first. Attendance shows up here once people sign.")},
    people:peopleSheet,complete:completeFlow})[b.dataset.act]());
  window.addEventListener("online",()=>{pull()});
  window.addEventListener("offline",finalStatus);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull();else flush()});
  setInterval(()=>{if(!pulled&&storedUser())pull();else if(pending())flush()},30000);
  poll();
}

/* ---------- no zoom (iPhone ignores the viewport setting, so block the gestures) ---------- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
["touchstart","touchmove"].forEach(t=>document.addEventListener(t,e=>{if((e.touches&&e.touches.length>1)||(e.scale!==undefined&&e.scale!==1))e.preventDefault()},{passive:false,capture:true}));
(()=>{const vp=document.querySelector('meta[name=viewport]'),base=vp.content;let busy=false;
  const reset=()=>{if(busy||!window.visualViewport||visualViewport.scale<=1.01)return;busy=true;
    vp.content=base.replace("maximum-scale=1","maximum-scale=1.01");setTimeout(()=>{vp.content=base;window.scrollTo(0,window.scrollY);busy=false},60)};
  if(window.visualViewport){visualViewport.addEventListener("resize",reset);visualViewport.addEventListener("scroll",()=>{if(visualViewport.offsetLeft>0)reset()})}
  document.addEventListener("focusout",()=>setTimeout(reset,100));
  document.addEventListener("touchend",()=>setTimeout(reset,50));
})();
document.addEventListener("focusout",()=>{setTimeout(()=>{if(window.scrollX)window.scrollTo(0,window.scrollY)},50)});

/* ---------- start ---------- */
(()=>{const m=(location.hash||"").slice(1).match(WORKER_RE);
  if(m)workerMain(m[1],m[2]);else supervisorMain();
  window.addEventListener("hashchange",()=>{const s=(location.hash||"").slice(1);
    if(WORKER_RE.test(s)||document.body.classList.contains("worker"))location.reload();
    else if(isDate(s)&&s!==cur)go(s)});
})();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
